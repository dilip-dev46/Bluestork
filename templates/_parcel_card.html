<a class="card link" href="{% url 'parcel_detail' p.code %}">
  <div class="row between">
    <span class="muted">{{ p.code }}</span>
    <span class="badge {{ p.status }}">{{ p.get_status_display }}</span>
  </div>
  <div class="route">{{ p.pickup_district }} &rarr; {{ p.drop_district }}</div>
  <div class="row between">
    <span class="muted">{{ p.weight_kg }} kg &middot; {{ p.created_at|date:"d M, h:i A" }}</span>
    <span class="price">&#8377;{% if show_payout %}{{ p.partner_payout }}{% else %}{{ p.price }}{% endif %}</span>
  </div>
</a>
